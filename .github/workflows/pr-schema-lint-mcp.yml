name: SQL Schema Lint via MCP

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.sql'
      - '**.ddl'
      - 'examples/rules/*.md'

env:
  MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL || 'https://schema-lint-mcp.example.com' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint-schema-mcp:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install MCP client
      run: |
        npm install -g @modelcontextprotocol/sdk
        # Or install a specific MCP client for your needs
        # npm install -g mcp-client-cli

    - name: Get changed SQL files
      id: changed-files
      uses: tj-actions/changed-files@v41
      with:
        files: |
          **.sql
          **.ddl

    - name: Connect to MCP Server and Lint Schemas
      if: steps.changed-files.outputs.any_changed == 'true'
      env:
        MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      run: |
        # Create a Node.js script to connect to MCP server
        cat > mcp-lint-client.js << 'EOF'
        const https = require('https');
        const fs = require('fs').promises;
        const path = require('path');

        // MCP server configuration
        const MCP_SERVER_URL = process.env.MCP_SERVER_URL || 'https://schema-lint-mcp.example.com';
        const MCP_API_KEY = process.env.MCP_API_KEY;

        // Helper function to make HTTP requests
        function makeRequest(endpoint, method, data) {
          return new Promise((resolve, reject) => {
            // Ensure base URL doesn't have trailing slash
            const baseUrl = MCP_SERVER_URL.replace(/\/$/, '');
            const url = new URL(endpoint, baseUrl);
            const options = {
              method: method,
              headers: {
                'Content-Type': 'application/json',
                'Authorization': MCP_API_KEY ? `Bearer ${MCP_API_KEY}` : undefined
              }
            };

            const req = https.request(url, options, (res) => {
              // Handle redirects
              if (res.statusCode === 301 || res.statusCode === 302) {
                const redirectUrl = res.headers.location;
                console.log(`Redirected to: ${redirectUrl}`);
                // If it's a relative redirect, resolve it against the base URL
                const newUrl = redirectUrl.startsWith('http') 
                  ? redirectUrl 
                  : new URL(redirectUrl, baseUrl).href;
                return makeRequest(newUrl, method, data).then(resolve).catch(reject);
              }
              
              let body = '';
              res.on('data', chunk => body += chunk);
              res.on('end', () => {
                if (res.statusCode >= 400) {
                  reject(new Error(`HTTP ${res.statusCode}: ${body}`));
                } else {
                  try {
                    resolve(JSON.parse(body));
                  } catch (e) {
                    resolve(body);
                  }
                }
              });
            });

            req.on('error', reject);
            if (data) {
              req.write(JSON.stringify(data));
            }
            req.end();
          });
        }

        async function main() {
          const changedFiles = process.env.CHANGED_FILES.split(' ').filter(f => f);
          
          // Initialize MCP session
          console.log('Initializing MCP session...');
          const initResponse = await makeRequest('/message', 'POST', {
            jsonrpc: '2.0',
            method: 'initialize',
            params: {
              protocolVersion: '0.1.0',
              clientInfo: {
                name: 'github-actions-client',
                version: '1.0.0'
              }
            },
            id: 1
          });
          console.log('Session initialized:', initResponse);

          // Read rules content
          const rulesContent = await fs.readFile('examples/rules/sql-schema-rules.md', 'utf8');
          
          let hasErrors = false;

          // Process each changed SQL file
          for (const file of changedFiles) {
            if (file.endsWith('.sql') || file.endsWith('.ddl')) {
              console.log(`\n=== Linting ${file} ===`);
              
              try {
                // Read schema content
                const schemaContent = await fs.readFile(file, 'utf8');
                
                // Call lint_schema tool
                const response = await makeRequest('/message', 'POST', {
                  jsonrpc: '2.0',
                  method: 'tools/call',
                  params: {
                    name: 'lint_schema',
                    arguments: {
                      schema_context: schemaContent,
                      rules_context: rulesContent,
                      output_format: 'json'
                    }
                  },
                  id: 2
                });

                if (response.error) {
                  console.error('Error from MCP server:', response.error);
                  hasErrors = true;
                  continue;
                }

                // Parse lint results
                const result = JSON.parse(response.result.content[0].text);
                
                if (result.totalIssues > 0) {
                  console.log(`Found ${result.totalIssues} issues (Errors: ${result.errorCount})`);
                  
                  result.issues.forEach(issue => {
                    console.log(`\n[${issue.severity.toUpperCase()}] Line ${issue.line}: ${issue.rule}`);
                    console.log(`  ${issue.message}`);
                    if (issue.suggestion) {
                      console.log(`  Suggestion: ${issue.suggestion}`);
                    }
                  });
                  
                  if (result.errorCount > 0) {
                    hasErrors = true;
                  }
                } else {
                  console.log('✓ No issues found');
                }
              } catch (error) {
                console.error(`Failed to lint ${file}:`, error.message);
                hasErrors = true;
              }
            }
          }

          process.exit(hasErrors ? 1 : 0);
        }

        main().catch(error => {
          console.error('Fatal error:', error);
          process.exit(1);
        });
        EOF

        # Run the MCP client
        export CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}"
        node mcp-lint-client.js

    - name: Comment PR with results
      if: failure() && steps.changed-files.outputs.any_changed == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const output = `
          ## ❌ SQL Schema Lint Failed
          
          The SQL schema linting check found issues in the changed files.
          Please review the workflow logs for detailed error messages.
          
          [View Full Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });