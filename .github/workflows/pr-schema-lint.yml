name: SQL Schema Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.sql'
      - '**.ddl'
      - 'examples/rules/*.md'

env:
  MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL || 'http://localhost:8070' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint-schema-mcp:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install MCP SDK
      run: |
        pip install mcp httpx

    - name: Get changed SQL files
      id: changed-files
      uses: tj-actions/changed-files@v41
      with:
        files: |
          **.sql
          **.ddl

    - name: Lint schemas using MCP
      if: steps.changed-files.outputs.any_changed == 'true'
      env:
        MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      run: |
        cat > lint_with_mcp.py << 'EOF'
        import os
        import sys
        import json
        import httpx
        from pathlib import Path

        # Configuration
        MCP_SERVER_URL = os.getenv('MCP_SERVER_URL', 'http://localhost:8070')
        MCP_API_KEY = os.getenv('MCP_API_KEY', '')
        CHANGED_FILES = os.getenv('CHANGED_FILES', '').split()

        # Setup headers
        headers = {
            'Content-Type': 'application/json'
        }
        if MCP_API_KEY:
            headers['Authorization'] = f'Bearer {MCP_API_KEY}'

        def call_mcp(method, params=None, id=1):
            """Make a JSON-RPC call to the MCP server"""
            payload = {
                'jsonrpc': '2.0',
                'method': method,
                'id': id
            }
            if params:
                payload['params'] = params
            
            # Ensure URL doesn't have trailing slash
            base_url = MCP_SERVER_URL.rstrip('/')
            
            try:
                with httpx.Client(follow_redirects=True) as client:
                    response = client.post(
                        f'{base_url}/message',
                        json=payload,
                        headers=headers,
                        timeout=60.0  # Increased timeout
                    )
                    response.raise_for_status()
                    return response.json()
            except httpx.ConnectError as e:
                print(f"ERROR: Cannot connect to MCP server at {base_url}")
                print(f"Connection error: {e}")
                print("\nMake sure:")
                print("1. MCP_SERVER_URL secret is configured correctly")
                print("2. The MCP server is running and accessible")
                print("3. Any required authentication is configured")
                sys.exit(1)
            except httpx.HTTPStatusError as e:
                print(f"ERROR: HTTP error from MCP server")
                print(f"Status: {e.response.status_code}")
                print(f"Response: {e.response.text}")
                sys.exit(1)
            except httpx.TimeoutException as e:
                print(f"ERROR: Request timed out after 60 seconds")
                print(f"The MCP server may be taking too long to process the request")
                print(f"Timeout error: {e}")
                sys.exit(1)

        def main():
            has_errors = False
            all_violations = {}  # Store violations by file
            
            # Debug: Print server URL
            print(f"MCP Server URL: {MCP_SERVER_URL}")
            print(f"Using endpoint: {MCP_SERVER_URL.rstrip('/')}/message")
            
            # Initialize MCP session
            print("Initializing MCP session...")
            init_response = call_mcp('initialize', {
                'protocolVersion': '0.1.0',
                'clientInfo': {
                    'name': 'github-actions',
                    'version': '1.0.0'
                }
            })
            print(f"Session initialized: {init_response}")
            
            # List available tools
            print("\nListing available tools...")
            tools_response = call_mcp('tools/list', {})
            print(f"Available tools: {json.dumps(tools_response, indent=2)}")
            
            # Read rules content
            rules_path = Path('examples/rules/sql-schema-rules.md')
            if not rules_path.exists():
                print(f"Rules file not found: {rules_path}")
                sys.exit(1)
            
            rules_content = rules_path.read_text()
            
            # Process each changed SQL file
            for file_path in CHANGED_FILES:
                if file_path.endswith(('.sql', '.ddl')):
                    print(f"\n=== Linting {file_path} ===")
                    
                    try:
                        # Read schema content
                        schema_content = Path(file_path).read_text()
                        
                        # Debug: Show file sizes
                        print(f"Schema size: {len(schema_content)} characters")
                        print(f"Rules size: {len(rules_content)} characters")
                        
                        # Call lint_schema tool
                        lint_response = call_mcp('tools/call', {
                            'name': 'lint_schema',
                            'arguments': {
                                'schema_context': schema_content,
                                'rules_context': rules_content,
                                'output_format': 'json'
                            }
                        }, id=2)
                        
                        # Debug: Show raw response
                        print(f"Raw MCP response: {json.dumps(lint_response, indent=2)}")
                        
                        if 'error' in lint_response:
                            print(f"Error from MCP server: {lint_response['error']}")
                            has_errors = True
                            continue
                        
                        # Parse results
                        if 'result' not in lint_response:
                            print(f"Unexpected response format: {lint_response}")
                            has_errors = True
                            continue
                            
                        # Handle different response formats
                        result_content = lint_response.get('result', {})
                        if isinstance(result_content, dict) and 'content' in result_content:
                            content = result_content['content']
                            if isinstance(content, list) and len(content) > 0:
                                result_text = content[0].get('text', '{}')
                            else:
                                result_text = '{}'
                        else:
                            print(f"Unexpected result format: {result_content}")
                            result_text = '{}'
                        
                        try:
                            result = json.loads(result_text)
                            print(f"Parsed result: {json.dumps(result, indent=2)}")
                        except json.JSONDecodeError:
                            print(f"Failed to parse result as JSON: {result_text}")
                            result = {}
                        
                        # Check both possible field names for total issues
                        total_issues = result.get('totalIssues', result.get('total_issues', 0))
                        
                        if total_issues > 0:
                            error_count = result.get('errorCount', result.get('errors', 0))
                            warning_count = result.get('warningCount', result.get('warnings', 0))
                            info_count = result.get('infoCount', result.get('info', 0))
                            
                            print(f"Found {total_issues} issues (Errors: {error_count}, Warnings: {warning_count}, Info: {info_count})")
                            
                            # Store violations for this file
                            all_violations[file_path] = {
                                'total': total_issues,
                                'errors': error_count,
                                'warnings': warning_count,
                                'info': info_count,
                                'issues': result.get('issues', [])
                            }
                            
                            for issue in result.get('issues', []):
                                severity = issue['severity'].upper()
                                rule_id = issue.get('rule_id', issue.get('rule', 'unknown'))
                                print(f"\n[{severity}] Line {issue['line']}: {rule_id}")
                                print(f"  {issue['message']}")
                                if issue.get('suggestion'):
                                    print(f"  Suggestion: {issue['suggestion']}")
                            
                            if error_count > 0:
                                has_errors = True
                        else:
                            print("✓ No issues found")
                            all_violations[file_path] = {
                                'total': 0,
                                'errors': 0,
                                'warnings': 0,
                                'info': 0,
                                'issues': []
                            }
                    
                    except httpx.TimeoutException as e:
                        print(f"WARNING: Timeout while linting {file_path}")
                        print(f"The file may be too large or complex for the MCP server to process within 60 seconds")
                        print(f"Continuing with other files...")
                        # Don't fail the workflow for timeouts, just warn
                    except Exception as e:
                        print(f"ERROR: Failed to lint {file_path}: {e}")
                        print(f"Error type: {type(e).__name__}")
                        has_errors = True
            
            # Save violations data for GitHub Actions
            with open('lint_violations.json', 'w') as f:
                json.dump(all_violations, f, indent=2)
            
            # Create GitHub annotations
            for file_path, file_data in all_violations.items():
                for issue in file_data['issues']:
                    severity = issue['severity'].lower()
                    level = 'error' if severity == 'error' else 'warning' if severity == 'warning' else 'notice'
                    rule_id = issue.get('rule_id', issue.get('rule', 'unknown'))
                    message = issue['message']
                    suggestion = issue.get('suggestion', '')
                    line = issue.get('line', 1)
                    
                    annotation = f"::{level} file={file_path},line={line},title={rule_id}::{message}"
                    if suggestion:
                        annotation += f" {suggestion}"
                    print(annotation)
            
            # Exit with appropriate code
            sys.exit(1 if has_errors else 0)

        if __name__ == '__main__':
            main()
        EOF
        
        export CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}"
        python lint_with_mcp.py

    - name: Create PR comment with summary
      if: always() && steps.changed-files.outputs.any_changed == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Read violations data
          let violations = {};
          try {
            violations = JSON.parse(fs.readFileSync('lint_violations.json', 'utf8'));
          } catch (e) {
            console.error('Failed to read violations:', e);
          }
          
          // Calculate totals
          let totalErrors = 0;
          let totalWarnings = 0;
          let totalInfo = 0;
          
          for (const [file, data] of Object.entries(violations)) {
            totalErrors += data.errors || 0;
            totalWarnings += data.warnings || 0;
            totalInfo += data.info || 0;
          }
          
          const hasErrors = totalErrors > 0;
          const totalIssues = totalErrors + totalWarnings + totalInfo;
          
          // Build comment
          let comment = hasErrors 
            ? '## ❌ SQL Schema Lint Failed\n\n'
            : totalIssues > 0
              ? '## ⚠️ SQL Schema Lint Completed with Warnings\n\n'
              : '## ✅ SQL Schema Lint Passed\n\n';
          
          if (totalIssues > 0) {
            // Summary section
            comment += '### 📊 Summary\n\n';
            comment += '| Severity | Count | Status |\n';
            comment += '|----------|-------|--------|\n';
            comment += `| 🔴 Errors | ${totalErrors} | ${totalErrors > 0 ? '❌ Must fix' : '✅ None'} |\n`;
            comment += `| 🟡 Warnings | ${totalWarnings} | ${totalWarnings > 0 ? '⚠️ Should fix' : '✅ None'} |\n`;
            comment += `| 🔵 Info | ${totalInfo} | ${totalInfo > 0 ? 'ℹ️ Consider' : '✅ None'} |\n`;
            comment += `| **Total** | **${totalIssues}** | |\n\n`;
            
            // File-by-file breakdown
            comment += '### 📁 Issues by File\n\n';
            
            for (const [file, data] of Object.entries(violations)) {
              if (data.total === 0) continue;
              
              const fileName = file.split('/').pop();
              comment += `<details>\n`;
              comment += `<summary><b>${fileName}</b> - ${data.total} issue${data.total > 1 ? 's' : ''} `;
              comment += `(${data.errors} error${data.errors !== 1 ? 's' : ''}, `;
              comment += `${data.warnings} warning${data.warnings !== 1 ? 's' : ''}, `;
              comment += `${data.info} info)</summary>\n\n`;
              
              // Group issues by severity
              const groupedIssues = {
                error: data.issues.filter(i => i.severity === 'error'),
                warning: data.issues.filter(i => i.severity === 'warning'),
                info: data.issues.filter(i => i.severity === 'info')
              };
              
              for (const [severity, issues] of Object.entries(groupedIssues)) {
                if (issues.length === 0) continue;
                
                const icon = severity === 'error' ? '🔴' : severity === 'warning' ? '🟡' : '🔵';
                comment += `#### ${icon} ${severity.charAt(0).toUpperCase() + severity.slice(1)}s\n\n`;
                
                for (const issue of issues) {
                  const ruleId = issue.rule_id || issue.rule || 'unknown';
                  comment += `- **Line ${issue.line}**: \`${ruleId}\`\n`;
                  comment += `  - ${issue.message}\n`;
                  if (issue.suggestion) {
                    comment += `  - 💡 ${issue.suggestion}\n`;
                  }
                  comment += '\n';
                }
              }
              
              comment += '</details>\n\n';
            }
            
            if (hasErrors) {
              comment += '### 🚨 Action Required\n\n';
              comment += '1. Review the **errors** above (must be fixed)\n';
              comment += '2. Consider fixing **warnings** for better code quality\n';
              comment += '3. Push your fixes to update this PR\n\n';
            } else if (totalWarnings > 0) {
              comment += '### 💡 Recommendations\n\n';
              comment += 'While not blocking, consider addressing the warnings above for better SQL schema quality.\n\n';
            }
          } else {
            comment += '✨ All SQL schemas comply with the defined rules. Excellent work!\n\n';
          }
          
          comment += '---\n';
          comment += `🤖 *Powered by [SQL Schema Lint MCP Server](https://github.com/${{ github.repository }})*`;
          
          // Post comment
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });