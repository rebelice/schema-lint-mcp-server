name: SQL Schema Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.sql'
      - '**.ddl'
      - 'examples/rules/*.md'

env:
  MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL || 'http://localhost:8070' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint-schema-mcp:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install MCP SDK
      run: |
        pip install mcp httpx

    - name: Get changed SQL files
      id: changed-files
      uses: tj-actions/changed-files@v41
      with:
        files: |
          **.sql
          **.ddl

    - name: Lint schemas using MCP
      if: steps.changed-files.outputs.any_changed == 'true'
      env:
        MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      run: |
        cat > lint_with_mcp.py << 'EOF'
        import os
        import sys
        import json
        import httpx
        from pathlib import Path

        # Configuration
        MCP_SERVER_URL = os.getenv('MCP_SERVER_URL', 'http://localhost:8070')
        MCP_API_KEY = os.getenv('MCP_API_KEY', '')
        CHANGED_FILES = os.getenv('CHANGED_FILES', '').split()

        # Setup headers
        headers = {
            'Content-Type': 'application/json'
        }
        if MCP_API_KEY:
            headers['Authorization'] = f'Bearer {MCP_API_KEY}'

        def call_mcp(method, params=None, id=1):
            """Make a JSON-RPC call to the MCP server"""
            payload = {
                'jsonrpc': '2.0',
                'method': method,
                'id': id
            }
            if params:
                payload['params'] = params
            
            # Ensure URL doesn't have trailing slash
            base_url = MCP_SERVER_URL.rstrip('/')
            
            try:
                with httpx.Client(follow_redirects=True) as client:
                    response = client.post(
                        f'{base_url}/message',
                        json=payload,
                        headers=headers,
                        timeout=60.0  # Increased timeout
                    )
                    response.raise_for_status()
                    return response.json()
            except httpx.ConnectError as e:
                print(f"ERROR: Cannot connect to MCP server at {base_url}")
                print(f"Connection error: {e}")
                print("\nMake sure:")
                print("1. MCP_SERVER_URL secret is configured correctly")
                print("2. The MCP server is running and accessible")
                print("3. Any required authentication is configured")
                sys.exit(1)
            except httpx.HTTPStatusError as e:
                print(f"ERROR: HTTP error from MCP server")
                print(f"Status: {e.response.status_code}")
                print(f"Response: {e.response.text}")
                sys.exit(1)
            except httpx.TimeoutException as e:
                print(f"ERROR: Request timed out after 60 seconds")
                print(f"The MCP server may be taking too long to process the request")
                print(f"Timeout error: {e}")
                sys.exit(1)

        def main():
            has_errors = False
            
            # Debug: Print server URL
            print(f"MCP Server URL: {MCP_SERVER_URL}")
            print(f"Using endpoint: {MCP_SERVER_URL.rstrip('/')}/message")
            
            # Initialize MCP session
            print("Initializing MCP session...")
            init_response = call_mcp('initialize', {
                'protocolVersion': '0.1.0',
                'clientInfo': {
                    'name': 'github-actions',
                    'version': '1.0.0'
                }
            })
            print(f"Session initialized: {init_response}")
            
            # Read rules content
            rules_path = Path('examples/rules/sql-schema-rules.md')
            if not rules_path.exists():
                print(f"Rules file not found: {rules_path}")
                sys.exit(1)
            
            rules_content = rules_path.read_text()
            
            # Process each changed SQL file
            for file_path in CHANGED_FILES:
                if file_path.endswith(('.sql', '.ddl')):
                    print(f"\n=== Linting {file_path} ===")
                    
                    try:
                        # Read schema content
                        schema_content = Path(file_path).read_text()
                        
                        # Call lint_schema tool
                        lint_response = call_mcp('tools/call', {
                            'name': 'lint_schema',
                            'arguments': {
                                'schema_context': schema_content,
                                'rules_context': rules_content,
                                'output_format': 'json'
                            }
                        }, id=2)
                        
                        if 'error' in lint_response:
                            print(f"Error from MCP server: {lint_response['error']}")
                            has_errors = True
                            continue
                        
                        # Parse results
                        if 'result' not in lint_response:
                            print(f"Unexpected response format: {lint_response}")
                            has_errors = True
                            continue
                            
                        # Handle different response formats
                        result_content = lint_response.get('result', {})
                        if isinstance(result_content, dict) and 'content' in result_content:
                            content = result_content['content']
                            if isinstance(content, list) and len(content) > 0:
                                result_text = content[0].get('text', '{}')
                            else:
                                result_text = '{}'
                        else:
                            print(f"Unexpected result format: {result_content}")
                            result_text = '{}'
                        
                        try:
                            result = json.loads(result_text)
                        except json.JSONDecodeError:
                            print(f"Failed to parse result as JSON: {result_text}")
                            result = {}
                        
                        if result.get('totalIssues', 0) > 0:
                            error_count = result.get('errorCount', 0)
                            print(f"Found {result['totalIssues']} issues (Errors: {error_count})")
                            
                            for issue in result.get('issues', []):
                                severity = issue['severity'].upper()
                                print(f"\n[{severity}] Line {issue['line']}: {issue['rule']}")
                                print(f"  {issue['message']}")
                                if issue.get('suggestion'):
                                    print(f"  Suggestion: {issue['suggestion']}")
                            
                            if error_count > 0:
                                has_errors = True
                        else:
                            print("✓ No issues found")
                    
                    except httpx.TimeoutException as e:
                        print(f"WARNING: Timeout while linting {file_path}")
                        print(f"The file may be too large or complex for the MCP server to process within 60 seconds")
                        print(f"Continuing with other files...")
                        # Don't fail the workflow for timeouts, just warn
                    except Exception as e:
                        print(f"ERROR: Failed to lint {file_path}: {e}")
                        print(f"Error type: {type(e).__name__}")
                        has_errors = True
            
            # Exit with appropriate code
            sys.exit(1 if has_errors else 0)

        if __name__ == '__main__':
            main()
        EOF
        
        export CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}"
        python lint_with_mcp.py

    - name: Create PR comment with summary
      if: always() && steps.changed-files.outputs.any_changed == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          // Check if the lint step failed
          const lintFailed = '${{ job.status }}' === 'failure';
          
          let comment = lintFailed 
            ? '## ❌ SQL Schema Lint Failed\n\n'
            : '## ✅ SQL Schema Lint Passed\n\n';
          
          comment += 'The MCP server has analyzed the SQL schema changes in this PR.\n\n';
          
          if (lintFailed) {
            comment += '### Issues Found\n';
            comment += 'Please review the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed error messages.\n\n';
            comment += '### Next Steps\n';
            comment += '1. Review the reported issues\n';
            comment += '2. Fix the schema problems\n';
            comment += '3. Push your changes to update this PR\n';
          } else {
            comment += 'All SQL schemas comply with the defined rules. Good job! 🎉\n';
          }
          
          // Post comment
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });